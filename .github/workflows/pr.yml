name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Needed for coverage diff
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d581728de53883309f31 # v2.10.1
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Quality Check
        run: pnpm build

      - name: Run Tests with Coverage on Changed Files
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          pnpm vitest run --coverage --changed ${{ github.base_ref }}

