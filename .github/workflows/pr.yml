name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Needed for coverage diff
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Quality Check
        run: pnpm build

      - name: Run Tests with Coverage on Changed Files
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          pnpm vitest run --coverage --changed ${{ github.base_ref }}

      - name: Verify Changeset
        id: changeset
        continue-on-error: true
        run: pnpm changeset status --since origin/${{ github.base_ref }}

      - name: Post Changeset Feedback
        if: steps.changeset.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const message = `### 🦋 Changeset Missing
            
            It looks like this PR modifies code but is missing a changeset.
            
            Please run the following command to generate one:
            \`\`\`bash
            pnpm changeset add
            \`\`\`
            
            <sub>If these changes do not need a release, run \`pnpm changeset add --empty\`.</sub>
            `;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
            
            core.setFailed('Changeset check failed. Please run `pnpm changeset add`.');
