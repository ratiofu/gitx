name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Needed for coverage diff
          filter: blob:none

      - name: Project Setup
        uses: ./.github/actions/setup

      - name: Build and Quality Check
        run: pnpm build-ci

      - name: Run Tests with Coverage on Changed Files
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          pnpm vitest run --passWithNoTests --coverage --changed ${{ github.base_ref }}

      - name: Verify Changeset
        id: changeset
        continue-on-error: true
        run: pnpm changeset status --since origin/${{ github.base_ref }}

      - name: Post Changeset Feedback
        if: steps.changeset.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const signature = '<!-- changeset-check-failure -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existingComment = comments.data.find(c => c.body.includes(signature));

            if (!existingComment) {
              const message = `${signature}
              ### 🦋 Changeset Missing
              
              It looks like this PR modifies code but is missing a changeset.
              
              Please run the following command to generate one:
              \`\`\`bash
              pnpm changeset add
              \`\`\`
              
              <sub>If these changes do not need a release, run \`pnpm changeset add --empty\`.</sub>
              `;
              
              await github.rest.issues.createComment({
                issue_number,
                owner,
                repo,
                body: message
              });
            }
            
            core.setFailed('Changeset check failed. Please run `pnpm changeset add`.');

      - name: Cleanup Changeset Feedback
        if: steps.changeset.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const signature = '<!-- changeset-check-failure -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existingComment = comments.data.find(c => c.body.includes(signature));

            if (existingComment) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existingComment.id,
              });
            }
